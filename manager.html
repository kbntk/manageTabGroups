<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab groups</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <button id="minimize" class="minimize" type="button" title="Close view" aria-label="Close view">×</button>
  <header>
    <h1>Tab groups</h1>
    <nav id="group-nav"></nav>
    <label class="setting"><input id="show-titles" type="checkbox"> Show titles above the bottom strip</label>
  </header>
  <div id="selection-bar" hidden>
    <span id="selection-count"></span>
    <button type="button" data-action="copy-to-group">Copy to another group</button>
    <button type="button" data-action="move-to-group">Move to another group</button>
    <button type="button" data-action="copy-to-new">Copy to a new group</button>
    <button type="button" data-action="move-to-new">Move to a new group</button>
  </div>
  <main id="groups"></main>
  <div id="strip-tools">
    <button id="tools-start" class="tools-nav" type="button" title="First tab" aria-label="First tab"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg></button>
    <button id="tools-first" class="tools-nav" type="button" title="Previous page of tabs">&lt;</button>
    <button id="center-active" class="center-button" type="button" title="Center the active tab"><span></span></button>
    <input id="strip-filter" type="search" placeholder="Filter tabs..." aria-label="Filter tabs">
    <button id="tools-last" class="tools-nav" type="button" title="Next page of tabs">&gt;</button>
    <button id="tools-end" class="tools-nav" type="button" title="Last tab" aria-label="Last tab"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg></button>
  </div>
  <div id="strip-bar">
    <button id="strip-first" class="strip-nav" type="button" title="First tab">&lt;</button>
    <section id="strip" aria-label="All tabs in window order"></section>
    <button id="strip-last" class="strip-nav" type="button" title="Last tab">&gt;</button>
  </div>
  <script src="manager.js"></script>
</body>
</html>
